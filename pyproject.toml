[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-financial-digital-twins"
version = "0.1.0"
description = "Synthetic Agro customer-agent laboratory for financial product scenario testing."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
authors = [{ name = "Foundry Financial Digital Twins contributors" }]
dependencies = [
  "aiohttp>=3.14.5,<4",
  "azure-ai-projects>=2.10,<3",
  "azure-cosmos>=4.9,<5",
  "azure-identity>=1.27,<2",
  "azure-monitor-opentelemetry>=1.8.11,<2",
  "azure-storage-blob>=12.27,<13",
  "fastapi>=0.121,<1",
  "openai>=3,<4",
  "pydantic>=2.12,<3",
  "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
financial-twins = "financial_twins.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
